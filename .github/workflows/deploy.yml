name: Deploy

# Ships what changed on main: the API to Railway, the admin dashboard to Cloudflare Pages, and the
# Android app to a Google Play testing track. Each target checks itself first, waits for the API (the
# app and dashboard may need its newest endpoints), and is verified live afterwards. A target whose
# secrets aren't set yet is skipped with a notice. Setup: docs/deploy.md.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      api:
        description: Deploy the API to Railway
        type: boolean
        default: true
      admin:
        description: Deploy the admin dashboard to Cloudflare Pages
        type: boolean
        default: true
      website:
        description: Deploy the marketing site to Cloudflare Pages
        type: boolean
        default: true
      android:
        description: Upload the Android app to Google Play
        type: boolean
        default: true
      play_track:
        description: Google Play track
        type: choice
        options: [ internal, alpha, beta, production ]
        default: internal

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      admin: ${{ steps.pick.outputs.admin }}
      website: ${{ steps.pick.outputs.website }}
      android: ${{ steps.pick.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_API: ${{ inputs.api }}
          IN_ADMIN: ${{ inputs.admin }}
          IN_WEBSITE: ${{ inputs.website }}
          IN_ANDROID: ${{ inputs.android }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "api=$IN_API" >> "$GITHUB_OUTPUT"
            echo "admin=$IN_ADMIN" >> "$GITHUB_OUTPUT"
            echo "website=$IN_WEBSITE" >> "$GITHUB_OUTPUT"
            echo "android=$IN_ANDROID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new branch or a force-push has no usable "before": ship everything.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(printf 'Dockerfile\nadmin/\nwebsite/\nandroid/\n')
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "api=$(has '^(src/|tests/|Dockerfile|railway\.json|Directory\.Build\.props|Twogether\.slnx)')" >> "$GITHUB_OUTPUT"
          echo "admin=$(has '^admin/')" >> "$GITHUB_OUTPUT"
          echo "website=$(has '^website/')" >> "$GITHUB_OUTPUT"
          echo "android=$(has '^android/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  api:
    name: API to Railway
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ vars.API_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'api' }}
      API_URL: ${{ vars.API_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice title=API not deployed::Set the RAILWAY_TOKEN secret (a Railway project token) to deploy the API. See docs/deploy.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.ready.outputs.go == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        if: steps.ready.outputs.go == 'true'
        run: |
          dotnet build Twogether.slnx -c Release
          dotnet test Twogether.slnx -c Release --no-build
      - name: Upload and build on Railway
        if: steps.ready.outputs.go == 'true'
        run: |
          # The image reports this commit on /health, which is how the next step knows it's live.
          echo "$GITHUB_SHA" > version.txt
          npx --yes @railway/cli@5.68.0 up --ci --service "$RAILWAY_SERVICE" --message "${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 80)"
      - name: Wait until the new build serves traffic
        if: steps.ready.outputs.go == 'true' && env.API_URL != ''
        run: |
          # Railway switches traffic only after /api/health/ready passes, so the old build keeps serving
          # until then. A build that never gets healthy is a failed deploy.
          for i in $(seq 1 90); do
            version=$(curl -fsS --max-time 10 "$API_URL/health" | jq -r .version 2>/dev/null || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              curl -fsS --max-time 10 "$API_URL/api/health/ready" && echo && echo "Live: $GITHUB_SHA" && exit 0
            fi
            sleep 10
          done
          echo "::error title=API not live::$API_URL still answers with version '${version:-none}' after 15 minutes. Check the deploy logs in Railway."
          exit 1
      - name: The dashboard may call the API
        if: steps.ready.outputs.go == 'true' && env.API_URL != '' && env.ADMIN_URL != ''
        run: |
          headers=$(curl -sS -o /dev/null -D - -X OPTIONS "$API_URL/api/admin/auth/login" \
            -H "Origin: $ADMIN_URL" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type")
          if ! echo "$headers" | grep -iq "^access-control-allow-origin: $ADMIN_URL"; then
            echo "::error title=CORS::The API doesn't allow $ADMIN_URL. Add it to Frontend__Origin in Railway."
            exit 1
          fi
      - if: steps.ready.outputs.go == 'true' && env.API_URL == ''
        run: echo "::warning title=Not verified::Set the API_URL variable so the pipeline can check the deploy went live."

  admin:
    name: Dashboard to Cloudflare Pages
    needs: [ changes, api ]
    # After the API (it may need new endpoints), unless the API failed; a skipped API is fine.
    if: always() && needs.changes.outputs.admin == 'true' && needs.api.result != 'failure' && needs.api.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: production-admin
      url: ${{ vars.ADMIN_URL }}
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'heartpact-admin' }}
      API_URL: ${{ vars.API_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$API_URL" ]; then
            echo "::notice title=Dashboard not deployed::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the API_URL variable. See docs/deploy.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Check and build
        if: steps.ready.outputs.go == 'true'
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          VITE_API_URL="$API_URL" npm run build
      - name: Upload to Cloudflare Pages
        if: steps.ready.outputs.go == 'true'
        run: npx --yes wrangler@4.151.0 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | head -c 80)"
      - name: Check the live dashboard
        if: steps.ready.outputs.go == 'true' && env.ADMIN_URL != ''
        run: |
          # The script this build produced must be what the site serves, with the security headers on.
          script=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null "$ADMIN_URL$script"; then
              headers=$(curl -sS -D - -o /dev/null "$ADMIN_URL/users")
              echo "$headers" | grep -iq "^x-frame-options: DENY" || { echo "::error::$ADMIN_URL is missing its security headers (public/_headers)."; exit 1; }
              echo "$headers" | grep -iq "^content-security-policy:" || { echo "::error::$ADMIN_URL has no Content-Security-Policy."; exit 1; }
              echo "Live: $ADMIN_URL$script"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Dashboard not live::$ADMIN_URL doesn't serve $script after 5 minutes."
          exit 1

  website:
    name: Marketing site to Cloudflare Pages
    needs: changes
    # Static pages: nothing to wait for. Only the deletion page calls the API, at API_URL.
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-website
      url: ${{ vars.SITE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_SITE_PROJECT || 'heartpact-site' }}
      API_URL: ${{ vars.API_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Every page translated and built
        run: python3 website/i18n/build.py check
      - id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$API_URL" ]; then
            echo "::notice title=Website not deployed::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the API_URL variable. See docs/website.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Point the deletion page at the API
        if: steps.ready.outputs.go == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R website/. "$RUNNER_TEMP/site/"
          # The translation sources aren't part of the site.
          rm -rf "$RUNNER_TEMP/site/i18n"
          api="${API_URL%/}"
          # The script that calls the API, and the Content-Security-Policy that allows it.
          sed -i "s#https://api.heartpact.app#$api#g" "$RUNNER_TEMP/site/assets/config.js" "$RUNNER_TEMP/site/_headers"
          grep -q "$api" "$RUNNER_TEMP/site/assets/config.js" && grep -q "connect-src 'self' $api" "$RUNNER_TEMP/site/_headers"
      - name: Upload to Cloudflare Pages
        if: steps.ready.outputs.go == 'true'
        run: npx --yes wrangler@4.151.0 pages deploy "$RUNNER_TEMP/site" --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | head -c 80)"
      - name: Check the live site
        if: steps.ready.outputs.go == 'true' && env.SITE_URL != ''
        run: |
          # This build's stylesheet must be what the site serves, with the security headers on.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$SITE_URL/assets/site.css" | cmp -s - website/assets/site.css; then
              headers=$(curl -sS -D - -o /dev/null "$SITE_URL/privacy/")
              echo "$headers" | grep -iq "^content-security-policy:" || { echo "::error::$SITE_URL has no Content-Security-Policy (website/_headers)."; exit 1; }
              # The deletion page signs in from the site's origin: the API must allow it in Frontend__Origin.
              allowed=$(curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $SITE_URL" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "${API_URL%/}/api/auth/login" | tr -d '\r' | grep -i "^access-control-allow-origin:" || true)
              [ -n "$allowed" ] || echo "::warning title=Deletion page can't reach the API::Add $SITE_URL to Frontend__Origin on the API. See docs/website.md."
              echo "Live: $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Website not live::$SITE_URL doesn't serve this build's stylesheet after 5 minutes."
          exit 1

  android:
    name: Android to Google Play
    needs: [ changes, api ]
    if: always() && needs.changes.outputs.android == 'true' && needs.api.result != 'failure' && needs.api.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: production-android
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # Release builds talk to the production API.
      HEARTPACT_RELEASE_API_URL: ${{ secrets.HEARTPACT_RELEASE_API_URL || (vars.API_URL && format('{0}/', vars.API_URL)) || '' }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      PLAY_INTEGRITY_PROJECT_NUMBER: ${{ secrets.PLAY_INTEGRITY_PROJECT_NUMBER }}
      PLAY_TRACK: ${{ inputs.play_track || vars.PLAY_TRACK || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing key and version
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=App not built::Set the ANDROID_KEYSTORE_* secrets to build a signed release. See docs/deploy.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # Play needs every upload's version code higher than the last; a re-run counts up too.
          echo "ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'
      - name: Test, bundle, and build the APK
        if: steps.key.outputs.present == 'true'
        run: ./gradlew testDebugUnitTest bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: heartpact-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      # The same production build as an APK, signed with the release key, to install directly on a phone.
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: heartpact-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        with:
          python-version: "3.12"
      - name: Upload to Google Play
        if: steps.key.outputs.present == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          python -m pip install --quiet google-api-python-client==2.201.0 google-auth==2.62.0
          python scripts/play_upload.py app/build/outputs/bundle/release/app-release.aab \
            --package app.heartpact --track "$PLAY_TRACK" --status "$PLAY_RELEASE_STATUS" \
            --notes "$(git log -1 --format=%s)"
      - if: steps.key.outputs.present == 'true' && env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::notice title=Not uploaded::The signed bundle is attached to this run. Set PLAY_SERVICE_ACCOUNT_JSON to upload it to Google Play."
