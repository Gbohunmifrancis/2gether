<!-- tab:us -->
{{STATUS}}
<div class="content">
  <div class="topbar"><h1 style="font-size:28px">Memories</h1><div class="row" style="gap:8px"><div class="icbtn">⤓</div><div class="icbtn" style="background:var(--ink);color:#fff;border-color:var(--ink)">+</div></div></div>
  <div class="card" style="padding:14px 16px;background:var(--gold-soft);border-color:transparent"><div class="row"><span style="font-size:22px">🗓️</span><div style="flex:1"><div class="bold">One year ago today</div><div class="muted small">Your first hike. 3 photos, 1 voice note.</div></div><span class="faint">›</span></div></div>
  <div class="between" style="margin:18px 0 10px"><span class="h3">October</span><div class="row" style="gap:6px"><span class="pill">All</span><span class="pill a">Ada</span><span class="pill b">Femi</span></div></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
    <div class="photo" style="grid-column:span 2;grid-row:span 2;height:196px;background:linear-gradient(160deg,#F8B195,#F67280 50%,#C06C84)"><div style="position:absolute;left:10px;bottom:10px" class="pill" style="background:#fff">🏃 After the 10k</div></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#355C7D,#6C5B7B)"></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#99B898,#FECEA8)"></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#FFD452,#FF9966)"></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#A8E6CF,#DCEDC1)"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px">▶</div></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#FF8B94,#FFAAA5)"></div>
    <div class="photo" style="height:95px;background:linear-gradient(135deg,#8E9EAB,#EEF2F3)"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink)">+14</div></div>
  </div>
  <div class="h3" style="margin:18px 0 10px">Import from</div>
  <div class="row" style="gap:8px"><span class="chip">📱 Phone gallery</span><span class="chip">Google Photos</span><span class="chip">iCloud</span></div>
  <div class="xs faint" style="margin-top:8px">Google Photos opens its own picker. We only see what you choose.</div>
</div>
