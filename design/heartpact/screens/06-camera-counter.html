<!-- dark -->
<div class="cam"></div>
<svg style="position:absolute;left:0;top:0" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- silhouette of a person mid-squat (abstract) -->
  <ellipse cx="195" cy="470" rx="150" ry="230" fill="rgba(255,255,255,.04)"/>
  <!-- pose skeleton -->
  <g stroke="#2BB7A3" stroke-width="4" stroke-linecap="round">
    <line x1="195" y1="300" x2="195" y2="400"/>
    <line x1="195" y1="320" x2="140" y2="380"/><line x1="140" y1="380" x2="120" y2="440"/>
    <line x1="195" y1="320" x2="250" y2="380"/><line x1="250" y1="380" x2="270" y2="440"/>
    <line x1="195" y1="400" x2="150" y2="470"/><line x1="150" y1="470" x2="165" y2="560"/>
    <line x1="195" y1="400" x2="240" y2="470"/><line x1="240" y1="470" x2="225" y2="560"/>
    <line x1="165" y1="560" x2="140" y2="600"/><line x1="225" y1="560" x2="250" y2="600"/>
  </g>
  <g fill="#fff" stroke="#2BB7A3" stroke-width="3">
    <circle cx="195" cy="272" r="22" fill="rgba(255,255,255,.15)"/>
    <circle cx="195" cy="320" r="6"/><circle cx="140" cy="380" r="6"/><circle cx="250" cy="380" r="6"/><circle cx="120" cy="440" r="6"/><circle cx="270" cy="440" r="6"/>
    <circle cx="195" cy="400" r="6"/><circle cx="150" cy="470" r="6"/><circle cx="240" cy="470" r="6"/><circle cx="165" cy="560" r="6"/><circle cx="225" cy="560" r="6"/>
  </g>
  <!-- knee angle callout -->
  <path d="M150 470 a28 28 0 0 1 20 -24" stroke="#F5B23D" stroke-width="3"/>
  <text x="96" y="492" fill="#F5B23D" font-family="Inter" font-size="13" font-weight="700">92°</text>
</svg>
{{STATUS}}
<div class="content noTab" style="position:relative;height:790px;display:flex;flex-direction:column;color:#fff">
  <div class="topbar">
    <div class="icbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <div class="pill" style="background:rgba(43,183,163,.25);color:#9FF0E3">● Body in frame · good angle</div>
    <div class="icbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h4l2 3h10v11a2 2 0 0 1-2 2H4z"/></svg></div>
  </div>
  <div style="text-align:center;margin-top:6px">
    <div class="num" style="font-size:120px;line-height:1">17</div>
    <div style="font-size:17px;color:rgba(255,255,255,.75);margin-top:-6px">of 30 squats</div>
  </div>
  <div style="flex:1"></div>
  <div class="card" style="background:rgba(20,14,30,.72);border-color:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(10px)">
    <div class="between small"><span class="bold">Femi's challenge</span><span style="color:rgba(255,255,255,.6)">⏱ 1:58 left</span></div>
    <div class="bar" style="margin-top:10px;background:rgba(255,255,255,.12)"><i style="width:57%;background:var(--b)"></i></div>
    <div class="row" style="margin-top:12px;gap:8px">
      <div class="pill" style="background:rgba(255,255,255,.1);color:#fff">Depth ✓</div><div class="pill" style="background:rgba(255,255,255,.1);color:#fff">Tempo ✓</div><div class="pill" style="background:rgba(245,178,61,.2);color:#FFD58A">Face visible</div>
    </div>
    <div class="xs" style="color:rgba(255,255,255,.5);margin-top:12px;line-height:1.4">Counting happens on your phone. A 3-second clip of your last rep goes to Femi when you finish.</div>
  </div>
  <div class="row" style="justify-content:center;gap:28px;margin-top:18px">
    <div class="icbtn" style="width:52px;height:52px;border-radius:50%"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
    <div style="width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;border-radius:7px;background:var(--a)"></div></div>
    <div class="icbtn" style="width:52px;height:52px;border-radius:50%"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4zM19 12a5 5 0 0 0-3-4.6M19 12a5 5 0 0 1-3 4.6"/></svg></div>
  </div>
</div>
