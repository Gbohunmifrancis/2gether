<!-- dark -->
<div style="position:absolute;inset:0;background:linear-gradient(160deg,#F2B880 0%,#D9775B 40%,#6B3A3A 100%)"></div>
<div style="position:absolute;left:70px;top:150px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE7B3,#E8A24A 60%,#B86B2E);box-shadow:0 30px 60px rgba(0,0,0,.35)"></div>
<div style="position:absolute;left:150px;top:200px;width:110px;height:80px;border-radius:40px;background:#8C4A2E;transform:rotate(-15deg)"></div>
{{STATUS}}
<div class="content noTab" style="position:relative;color:#fff">
  <div class="topbar"><div class="icbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="pill ghost">Scan 2 of 3 today</div><span style="width:40px"></span></div>
</div>
<div class="sheet" style="padding-bottom:24px">
  <div class="grab"></div>
  <div class="between"><div><div class="faint xs bold" style="text-transform:uppercase;letter-spacing:.4px">We think this is</div><h2 style="margin-top:4px">Jollof rice &amp; grilled chicken</h2></div><div class="pill b">87% sure</div></div>
  <div class="row" style="margin-top:16px;gap:14px;align-items:flex-end">
    <div class="num" style="font-size:52px;line-height:1">~640</div><div class="muted" style="padding-bottom:8px">kcal<br><span class="xs faint">range 540 – 740</span></div>
  </div>
  <div class="grid2" style="grid-template-columns:1fr 1fr 1fr;margin-top:14px">
    <div class="card" style="padding:12px;text-align:center"><div class="num" style="font-size:20px;color:var(--a-deep)">38 g</div><div class="xs faint bold">PROTEIN</div></div>
    <div class="card" style="padding:12px;text-align:center"><div class="num" style="font-size:20px;color:#9A6A0E">72 g</div><div class="xs faint bold">CARBS</div></div>
    <div class="card" style="padding:12px;text-align:center"><div class="num" style="font-size:20px;color:#3F4FC6">21 g</div><div class="xs faint bold">FAT</div></div>
  </div>
  <div class="between" style="margin-top:14px"><span class="bold small">Portion</span><div class="seg" style="width:200px"><div>Small</div><div class="on">Medium</div><div>Large</div></div></div>
  <div class="divider"></div>
  <div class="between"><div class="row"><div class="avatar b" style="width:28px;height:28px;font-size:12px">F</div><span class="small">Femi had the same? Log for both</span></div><div class="toggle"></div></div>
  <div class="row" style="margin-top:16px;gap:10px"><div class="btn ghost" style="flex:1">Fix name</div><div class="btn primary" style="flex:1.4">Log lunch</div></div>
  <div class="homebar" style="position:static;margin:18px auto 0;transform:none"></div>
</div>
