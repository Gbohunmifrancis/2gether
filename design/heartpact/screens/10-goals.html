<!-- tab:goals -->
{{STATUS}}
<div class="content">
  <div class="topbar"><h1 style="font-size:28px">Goals</h1><div class="icbtn" style="background:var(--ink);color:#fff;border-color:var(--ink)">+</div></div>
  <div class="seg" style="margin-bottom:14px"><div class="on">This week</div><div>Month</div><div>All time</div></div>
  <div class="card">
    <div class="between"><div class="h3">Shared weekly target</div><span class="pill b">On track</span></div>
    <div class="row" style="margin-top:16px;gap:16px">
      <div class="ring" style="width:110px;height:110px">
        <svg viewBox="0 0 110 110" width="110" height="110">
          <circle cx="55" cy="55" r="46" fill="none" stroke="var(--a-soft)" stroke-width="11"/>
          <circle cx="55" cy="55" r="46" fill="none" stroke="var(--a)" stroke-width="11" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="87" transform="rotate(-90 55 55)"/>
          <circle cx="55" cy="55" r="32" fill="none" stroke="var(--b-soft)" stroke-width="11"/>
          <circle cx="55" cy="55" r="32" fill="none" stroke="var(--b)" stroke-width="11" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="80" transform="rotate(-90 55 55)"/>
        </svg>
      </div>
      <div class="stack" style="flex:1;gap:12px">
        <div class="kpi"><div class="v num">5 <span class="muted" style="font-size:14px;font-weight:500;letter-spacing:0">/ 8 workouts</span></div><div class="l">Together</div></div>
        <div class="row" style="gap:14px"><div class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:5px;background:var(--a)"></i><span class="small">Ada 3</span></div><div class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:5px;background:var(--b)"></i><span class="small">Femi 2</span></div></div>
      </div>
    </div>
    <div class="row" style="margin-top:16px;gap:6px;align-items:flex-end;height:52px">
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:30px;border-radius:4px;background:var(--a)"></i><i style="height:14px;border-radius:4px;background:var(--b)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:18px;border-radius:4px;background:var(--a)"></i><i style="height:26px;border-radius:4px;background:var(--b)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:0;border-radius:4px;background:var(--a)"></i><i style="height:40px;border-radius:4px;background:var(--b)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:34px;border-radius:4px;background:var(--a)"></i><i style="height:20px;border-radius:4px;background:var(--b)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:44px;border-radius:4px;background:var(--a)"></i><i style="height:0;border-radius:4px;background:var(--b)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:10px;border-radius:4px;background:var(--line)"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:3px;justify-content:flex-end;height:100%"><i style="height:10px;border-radius:4px;background:var(--line)"></i></div>
    </div>
    <div class="row xs faint" style="margin-top:6px;justify-content:space-between;padding:0 4px"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  </div>
  <div class="h3" style="margin:18px 0 10px">Active goals</div>
  <div class="stack" style="gap:10px">
    <div class="card" style="padding:14px 16px"><div class="between"><div class="row"><div class="ic" style="width:40px;height:40px;border-radius:12px;background:var(--a-soft);display:flex;align-items:center;justify-content:center">🏃‍♀️</div><div><div class="bold">Run 10 km a week</div><div class="faint small">Ada · 6.4 / 10 km</div></div></div><span class="num" style="font-size:18px">64%</span></div><div class="bar" style="margin-top:12px"><i style="width:64%;background:var(--a)"></i></div></div>
    <div class="card" style="padding:14px 16px"><div class="between"><div class="row"><div class="ic" style="width:40px;height:40px;border-radius:12px;background:var(--b-soft);display:flex;align-items:center;justify-content:center">💪</div><div><div class="bold">Gym 3× a week</div><div class="faint small">Femi · 2 / 3 sessions</div></div></div><span class="num" style="font-size:18px">67%</span></div><div class="bar" style="margin-top:12px"><i style="width:67%;background:var(--b)"></i></div></div>
    <div class="card" style="padding:14px 16px"><div class="between"><div class="row"><div class="ic" style="width:40px;height:40px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center">🥗</div><div><div class="bold">Under 1,900 kcal, 5 days</div><div class="faint small">Both · 3 / 5 days</div></div></div><span class="num" style="font-size:18px">60%</span></div><div class="bar" style="margin-top:12px"><i style="width:60%;background:var(--gold)"></i></div></div>
    <div class="card" style="padding:14px 16px;border-style:dashed;background:transparent"><div class="row" style="justify-content:center;color:var(--ink-3)"><span class="bold small">+ Set a goal for Femi</span></div></div>
  </div>
</div>
{{TAB}}
